<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3d28">
<title>Gemspire — Play</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05140d; }
  /* Le dessin garde sa taille (1280 x 800) ; le CSS l'agrandit ou le réduit à la
     taille de la page sans le déformer (format 16:10, centré) */
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, 160vh); height: min(62.5vw, 100vh);
           touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #ffd140;
             font: 600 1.3rem system-ui, sans-serif; text-align: center; }
  #loading small { display: block; color: #b9d2c2; font-weight: 400; margin-top: .5em; }
  /* Téléphone tenu en hauteur : le plateau est conçu pour l'horizontale */
  #rotate { display: none; position: fixed; inset: 0; background: #0f3d28; color: #eef3ef;
            font: 1.1rem system-ui, sans-serif; text-align: center; place-items: center; padding: 24px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: grid; } }
</style>
</head>
<body>
<div id="loading">Gemspire<small>Loading… / Chargement…</small></div>
<div id="rotate"><div>↻<br>Turn your phone sideways to play.<br>Tournez votre téléphone pour jouer.</div></div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  var Module = {
    canvas: document.getElementById("canvas"),
    // Fichiers du jeu (session, sauvegarde) gardés dans le navigateur (IndexedDB)
    preRun: [function () {
      FS.mkdir("/data");
      FS.mount(IDBFS, {}, "/data");
      FS.chdir("/data");
      addRunDependency("syncfs");
      FS.syncfs(true, function () { removeRunDependency("syncfs"); });
    }],
    onRuntimeInitialized: function () { document.getElementById("loading").remove(); },
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); }
  };

  // Activité Discord : le jeu est ouvert dans un salon vocal (Discord ajoute
  // frame_id et instance_id à l'adresse). On parle à Discord par postMessage
  // (le même protocole que le SDK officiel, sans le télécharger) pour obtenir
  // un code de connexion ; le jeu l'échange ensuite auprès du serveur.
  var gemspireActivity = (function () {
    var params = new URLSearchParams(window.location.search);
    var frameId = params.get("frame_id");
    var inActivity = !!frameId && !!params.get("instance_id");
    var state = { code: "", error: "" };
    var parentOrigin = document.referrer ? new URL(document.referrer).origin : "*";
    var clientId = "";
    var authorizeNonce = "";

    function send(opcode, payload) {
      window.parent.postMessage([opcode, payload], parentOrigin);
    }

    function onMessage(event) {
      if (!Array.isArray(event.data) || event.data[0] !== 1) {
        return;  // seulement les messages FRAME (opcode 1)
      }
      var frame = event.data[1] || {};
      if (frame.cmd === "DISPATCH" && frame.evt === "READY") {
        authorizeNonce = String(Date.now()) + Math.random().toString(16).slice(2);
        send(1, { cmd: "AUTHORIZE", nonce: authorizeNonce,
                  args: { client_id: clientId, response_type: "code", state: "", prompt: "none",
                          scope: ["identify"] } });
      } else if (frame.nonce === authorizeNonce) {
        if (frame.evt === "ERROR" || !frame.data || !frame.data.code) {
          state.error = (frame.data && frame.data.message) || "Discord refused the sign-in.";
        } else {
          state.code = frame.data.code;
        }
      }
    }

    return {
      active: inActivity,
      instanceId: params.get("instance_id") || "",
      // Poignée de main avec Discord, puis AUTHORIZE dès que Discord est prêt
      start: function (id) {
        if (!inActivity || clientId) {
          return;
        }
        clientId = id;
        window.addEventListener("message", onMessage);
        send(0, { v: 1, encoding: "json", client_id: clientId, frame_id: frameId });
      },
      // "code:..." ou "error:..." une seule fois, "" en attendant
      take: function () {
        var result = state.code ? "code:" + state.code : state.error ? "error:" + state.error : "";
        state.code = "";
        state.error = "";
        return result;
      }
    };
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
