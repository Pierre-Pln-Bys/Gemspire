<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3d28">
<title>Gemspire — Play</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05140d; }
  /* Le dessin garde sa taille (1280 x 800) ; le CSS l'agrandit ou le réduit à la
     taille de la page sans le déformer (format 16:10, centré) */
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, 160vh); height: min(62.5vw, 100vh);
           touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #ffd140;
             font: 600 1.3rem system-ui, sans-serif; text-align: center; }
  #loading small { display: block; color: #b9d2c2; font-weight: 400; margin-top: .5em; }
  /* Téléphone tenu en hauteur : le plateau est conçu pour l'horizontale */
  #rotate { display: none; position: fixed; inset: 0; background: #0f3d28; color: #eef3ef;
            font: 1.1rem system-ui, sans-serif; text-align: center; place-items: center; padding: 24px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: grid; } }
</style>
</head>
<body>
<div id="loading">Gemspire<small>Loading… / Chargement…</small></div>
<div id="rotate"><div>↻<br>Turn your phone sideways to play.<br>Tournez votre téléphone pour jouer.</div></div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  var Module = {
    canvas: document.getElementById("canvas"),
    // Fichiers du jeu (session, sauvegarde) gardés dans le navigateur (IndexedDB)
    preRun: [function () {
      FS.mkdir("/data");
      FS.mount(IDBFS, {}, "/data");
      FS.chdir("/data");
      addRunDependency("syncfs");
      FS.syncfs(true, function () { removeRunDependency("syncfs"); });
    }],
    onRuntimeInitialized: function () { document.getElementById("loading").remove(); },
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
