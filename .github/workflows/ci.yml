# Vérifie chaque push et chaque pull request : compilation (avec -Werror)
# et tests, sous Linux (console + interface graphique) et Windows (console).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Compilation
        run: make
      - name: Tests
        run: make test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Compilation (console)
        run: make splendor
      - name: Tests
        run: make test
