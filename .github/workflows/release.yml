# Publie les exécutables du jeu à chaque version MAJEURE.
#
# Déclenchement : push d'un tag de la forme vX.0.0 (ex : v2.0.0, v3.0.0).
# Les versions mineures/correctives (v2.1.0, v2.0.1) ne déclenchent rien.
# Lancement manuel possible (onglet Actions ou `gh workflow run release.yml
# -f tag=v2.0.0`) pour (re)publier un tag existant.
#
# Fichiers attachés à la release GitHub (téléchargeables directement, sans zip) :
#   - splendor-windows.exe       jeu console pour Windows (autonome)
#   - splendor-linux             jeu console pour Linux x86_64 (autonome)
#   - splendor-gui-linux         interface graphique Linux (nécessite GTK 3)
name: Release majeure

on:
  push:
    tags:
      - "v[0-9]+.0.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à publier (ex : v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 : glibc plus ancienne, donc binaire compatible avec plus de distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Tests
        run: make test

      - name: Version console (liée statiquement)
        run: |
          make splendor LDFLAGS=-static
          ./splendor --version
          mv splendor splendor-linux

      - name: Version graphique
        run: |
          make splendor-gui
          mv splendor-gui splendor-gui-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            splendor-linux
            splendor-gui-linux

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc

      - name: Tests
        run: make test

      - name: Version console (liée statiquement, sans DLL)
        run: |
          make splendor LDFLAGS=-static
          ./splendor.exe --version
          mv splendor.exe splendor-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: splendor-windows.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Rendre les binaires Linux exécutables
        run: chmod +x splendor-linux splendor-gui-linux

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Splendor ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            splendor-windows.exe
            splendor-linux
            splendor-gui-linux
