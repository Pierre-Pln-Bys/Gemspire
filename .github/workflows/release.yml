# Publie les exécutables du jeu à chaque version MAJEURE.
#
# Déclenchement : push d'un tag de la forme vX.0.0 (ex : v2.0.0, v3.0.0).
# Les versions mineures/correctives (v2.1.0, v2.0.1) ne déclenchent rien.
# Lancement manuel possible (onglet Actions ou `gh workflow run release.yml
# -f tag=v2.0.0`) pour (re)publier un tag existant.
#
# Fichiers attachés à la release GitHub (téléchargeables directement, sans zip) :
#   - gemspire-windows.exe          jeu graphique pour Windows (autonome)
#   - gemspire-linux                jeu graphique pour Linux x86_64 (autonome)
#   - gemspire-console-windows.exe  version console pour Windows
#   - gemspire-console-linux        version console pour Linux
name: Release majeure

on:
  push:
    tags:
      - "v[0-9]+.0.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à publier (ex : v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 : glibc plus ancienne, donc binaire compatible avec plus de distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libssl-dev

      - name: Tests
        run: make test

      - name: Version console (liée statiquement)
        run: |
          make splendor LDFLAGS=-static
          ./splendor --version
          mv splendor gemspire-console-linux

      - name: Version graphique (raylib incluse)
        run: |
          make splendor-gui
          mv splendor-gui gemspire-linux

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            gemspire-linux
            gemspire-console-linux

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl

      - name: Tests
        run: make test

      - name: Version console (liée statiquement, sans DLL)
        run: |
          make splendor LDFLAGS=-static
          ./splendor.exe --version
          mv splendor.exe gemspire-console-windows.exe

      - name: Version graphique (raylib incluse, sans DLL)
        run: |
          make splendor-gui
          mv splendor-gui.exe gemspire-windows.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            gemspire-windows.exe
            gemspire-console-windows.exe

  web:
    # Jeu dans le navigateur (WebAssembly), servi par le serveur sur /play ;
    # deploy/install.sh télécharge cette archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install 4.0.10
          ./emsdk/emsdk activate 4.0.10

      - name: Version navigateur
        run: |
          source ./emsdk/emsdk_env.sh
          make web
          tar czf gemspire-web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: gemspire-web.tar.gz

  release:
    needs: [linux, windows, web]
    runs-on: ubuntu-latest
    steps:
      # Le dépôt (CHANGELOG.md, tools/) pour l'annonce Discord
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Rendre les binaires Linux exécutables
        run: chmod +x gemspire-linux gemspire-console-linux

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Gemspire ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            gemspire-windows.exe
            gemspire-linux
            gemspire-console-windows.exe
            gemspire-console-linux
            gemspire-web.tar.gz

      # Annonce dans le salon Discord des nouveautés (secret DISCORD_RELEASE_WEBHOOK) ;
      # sans le secret, rien n'est envoyé. Un échec ne bloque pas la release.
      - name: Changelog sur Discord
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: python3 tools/discord_release.py "${{ inputs.tag || github.ref_name }}"
